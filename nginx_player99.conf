# ==============================================================================
# CONFIGURAÇÃO NGINX OTIMIZADA PARA O PLAYER99 (AAPanel)
# ==============================================================================
# Você pode colar este bloco no seu site no aaPanel:
# Caminho: aaPanel > Websites > Clique no Domínio > Config / URL Rewrite
# ==============================================================================

# Limite para Upload de Vídeos e Banners Grandes
client_max_body_size 256M;
client_body_buffer_size 128k;

# 1. Roteamento MVC Inteligente (Player99 2.0)
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# 2. Bloqueio de Segurança Crítica: Bancos de Dados SQLite, JSONs e Arquivos Ocultos
location ~* \.(db|sqlite|sqlite3|db-wal|db-shm|json|log|env|ini|sql|bak|sh|git.*)$ {
    deny all;
    return 404;
}

# 3. Bloqueio de Arquivos Ocultos e Dotfiles (Ex: /api/.db.db, .htaccess)
location ~ /\. {
    deny all;
    return 404;
}

# 4. Bloqueio de Scripts de Teste e Depuração em Produção
location ~* ^/(test_.*|check.*|teste|dump_schema)\.php$ {
    deny all;
    return 404;
}

# 5. Otimização de Streaming e Cache de Vídeos e Mídias Indoor
location ~* \.(mp4|webm|ogg|ts|m3u8|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, no-transform";
    access_log off;
    log_not_found off;
}
